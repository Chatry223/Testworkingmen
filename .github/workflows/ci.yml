name: CI
on: [push, pull_request]
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: 22}
   - run: npm install
   - run: npm test
   - run: node --check src/index.js && node --check src/proxy.js && node --check src/ip-policy.js && node --check src/security.js && node --check src/singbox.js && node --check src/protocol/vless.js && node --check relay/server.js
