name = "volveedge"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws", "/sub/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "volveedge"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
