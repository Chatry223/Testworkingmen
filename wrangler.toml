name = "volveedge"
main = "src/index.js"
compatibility_date = "2026-11-20"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws", "/sub/*", "/health"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "volveedge"
database_id = "00000000-0000-0000-0000-000000000000"
