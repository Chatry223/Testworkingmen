services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      AUTH_URL: "${AUTH_URL}"
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET}"
      WS_PATH: "/ws"
    expose:
      - "8080"
    networks:
      - edge
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      RELAY_DOMAIN: "${RELAY_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
networks:
  edge:
volumes:
  caddy_data:
  caddy_config:
